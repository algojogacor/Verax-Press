<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" fill="none">
  <rect width="1100" height="520" fill="#FBF9F5"/>
  <rect x="24" y="24" width="1052" height="472" fill="#FFFFFF" stroke="#141413" stroke-width="1.5"/>

  <text x="56" y="68" fill="#8B1E1E" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    DIAGRAM IN-LINE · ALUR KEWAJIBAN HUKUM 72 JAM PASCA-INSIDEN KEBOCORAN DATA
  </text>
  <text x="56" y="98" fill="#141413" font-family="Georgia, serif" font-size="24" font-weight="700">
    Kesenjangan antara Deteksi Insiden Teknis dan Notifikasi Publik
  </text>
  <line x1="56" y1="118" x2="1044" y2="118" stroke="#E5E0D5" stroke-width="1.5"/>

  <!-- Timeline Axis -->
  <line x1="90" y1="245" x2="1010" y2="245" stroke="#141413" stroke-width="3"/>

  <!-- Step 1: T+0 Jam -->
  <circle cx="150" cy="245" r="14" fill="#8B1E1E" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="70" y="142" width="180" height="74" fill="#FEF2F2" stroke="#8B1E1E"/>
  <text x="86" y="166" fill="#8B1E1E" font-family="monospace" font-size="11" font-weight="700">JAM KE-00 · DETEKSI</text>
  <text x="86" y="188" fill="#141413" font-family="sans-serif" font-size="12" font-weight="700">Anomali Eksfiltrasi Log</text>
  <text x="86" y="205" fill="#57534E" font-family="sans-serif" font-size="11">Tim CSIRT mencatat insiden</text>

  <!-- Step 2: T+24 Jam -->
  <circle cx="440" cy="245" r="14" fill="#141413" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="345" y="280" width="200" height="86" fill="#F4EFE6" stroke="#141413"/>
  <text x="361" y="304" fill="#141413" font-family="monospace" font-size="11" font-weight="700">JAM KE-24 · VERIFIKASI FORENSIK</text>
  <text x="361" y="326" fill="#141413" font-family="sans-serif" font-size="12" font-weight="700">Pemetaan Ruang Lingkup Data</text>
  <text x="361" y="346" fill="#57534E" font-family="sans-serif" font-size="11">Identifikasi jumlah warga terdampak</text>

  <!-- Step 3: T+48 Jam -->
  <circle cx="710" cy="245" r="14" fill="#B45309" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="615" y="142" width="205" height="74" fill="#FFFBEB" stroke="#B45309"/>
  <text x="631" y="166" fill="#B45309" font-family="monospace" font-size="11" font-weight="700">JAM KE-48 · KOORDINASI BSSN</text>
  <text x="631" y="188" fill="#141413" font-family="sans-serif" font-size="12" font-weight="700">Penutupan Celah Kriptografi</text>
  <text x="631" y="205" fill="#57534E" font-family="sans-serif" font-size="11">Rotasi sertifikat &amp; kunci akses</text>

  <!-- Step 4: T+72 Jam -->
  <circle cx="960" cy="245" r="16" fill="#14532D" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="820" y="280" width="215" height="96" fill="#ECFDF3" stroke="#14532D" stroke-width="1.5"/>
  <text x="836" y="304" fill="#14532D" font-family="monospace" font-size="11" font-weight="700">JAM KE-72 · BATAS MAKSIMUM</text>
  <text x="836" y="326" fill="#141413" font-family="sans-serif" font-size="12" font-weight="700">Pemberitahuan Tertulis Wajib</text>
  <text x="836" y="346" fill="#14532D" font-family="sans-serif" font-size="11">Kepada Subjek Data &amp; Otoritas</text>
  <text x="836" y="364" fill="#57534E" font-family="monospace" font-size="10">Pasal 46 ayat (1) &amp; (2) UU PDP</text>

  <!-- Bottom Analytical Note -->
  <rect x="56" y="412" width="988" height="54" fill="#F4EFE6"/>
  <text x="76" y="436" fill="#141413" font-family="sans-serif" font-size="12" font-weight="700">
    Temuan Riset Redaksi Verity:
  </text>
  <text x="76" y="454" fill="#44403C" font-family="sans-serif" font-size="12">
    Tanpa log audit otomatis yang terhubung ke modul pelaporan insiden, waktu verifikasi internal kerap melampaui ambang 72 jam.
  </text>
