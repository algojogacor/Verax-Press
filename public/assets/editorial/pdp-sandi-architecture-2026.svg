  </text>
  <line x1="468" y1="246" x2="732" y2="246" stroke="#3F3D39" stroke-width="1.5"/>

  <circle cx="600" cy="336" r="62" fill="#1F1E1C" stroke="#D6CEBE" stroke-width="2"/>
  <circle cx="600" cy="336" r="44" fill="none" stroke="#8B1E1E" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="600" y="332" fill="#FBF9F5" font-family="monospace" font-size="17" font-weight="700" text-anchor="middle">3x24 JAM</text>
  <text x="600" y="352" fill="#D6CEBE" font-family="monospace" font-size="10" text-anchor="middle">BATAS NOTIFIKASI</text>

  <rect x="468" y="428" width="264" height="96" fill="#23221F" stroke="#57534E"/>
  <text x="486" y="454" fill="#FBF9F5" font-family="monospace" font-size="11" font-weight="700">PASAL 46 UU NO. 27 TAHUN 2022</text>
  <text x="486" y="476" fill="#D6CEBE" font-family="sans-serif" font-size="12">Wajib pemberitahuan tertulis kepada</text>
  <text x="486" y="496" fill="#D6CEBE" font-family="sans-serif" font-size="12">Subjek Data &amp; Lembaga Pengawas PDP.</text>

  <!-- Right Node: Public Accountability & Citizen Rights -->
  <rect x="818" y="138" width="306" height="412" fill="#FFFFFF" stroke="#141413" stroke-width="2"/>
  <rect x="818" y="138" width="306" height="8" fill="#14532D"/>
  <text x="842" y="176" fill="#14532D" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">
