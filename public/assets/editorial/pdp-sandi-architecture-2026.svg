  </text>
  <line x1="100" y1="246" x2="358" y2="246" stroke="#C7C0B3" stroke-width="1.5"/>

  <rect x="100" y="266" width="258" height="66" fill="#FBF9F5" stroke="#C7C0B3"/>
  <text x="116" y="292" fill="#141413" font-family="sans-serif" font-size="12.5" font-weight="700">Basis Data Kependudukan &amp; Layanan</text>
  <text x="116" y="313" fill="#57534E" font-family="monospace" font-size="11">Enkripsi At-Rest: AES-256-GCM</text>

  <rect x="100" y="348" width="258" height="66" fill="#FBF9F5" stroke="#C7C0B3"/>
  <text x="116" y="374" fill="#141413" font-family="sans-serif" font-size="12.5" font-weight="700">Gateway Pertukaran API Antar-Sistem</text>
  <text x="116" y="395" fill="#57534E" font-family="monospace" font-size="11">mTLS 1.3 · Sertifikat Terverifikasi</text>

  <rect x="100" y="432" width="258" height="92" fill="#FBF9F5" stroke="#8B1E1E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="116" y="458" fill="#8B1E1E" font-family="monospace" font-size="11" font-weight="700">TITIK RAWAN TEMUAN AUDIT:</text>
  <text x="116" y="480" fill="#141413" font-family="sans-serif" font-size="12">Ketiadaan Bukti Audit Kunci Kriptografi</text>
  <text x="116" y="500" fill="#57534E" font-family="sans-serif" font-size="12">pada Sub-Prosesor Pihak Ketiga</text>

