  </text>
  <text x="842" y="228" fill="#141413" font-family="Georgia, serif" font-size="18.5" font-weight="700">
    Pemulihan Hukum Warga
  </text>
  <line x1="842" y1="246" x2="1100" y2="246" stroke="#C7C0B3" stroke-width="1.5"/>

  <rect x="842" y="266" width="258" height="72" fill="#FBF9F5" stroke="#C7C0B3"/>
  <text x="858" y="292" fill="#141413" font-family="sans-serif" font-size="12.5" font-weight="700">1. Rincian Data yang Terpapar</text>
  <text x="858" y="314" fill="#57534E" font-family="sans-serif" font-size="12">Klasifikasi data spesifik vs umum</text>

  <rect x="842" y="354" width="258" height="72" fill="#FBF9F5" stroke="#C7C0B3"/>
  <text x="858" y="380" fill="#141413" font-family="sans-serif" font-size="12.5" font-weight="700">2. Kronologi &amp; Mitigasi Teknis</text>
  <text x="858" y="402" fill="#57534E" font-family="sans-serif" font-size="12">Bukti isolasi insiden yang dapat diuji</text>

  <rect x="842" y="442" width="258" height="82" fill="#FBF9F5" stroke="#14532D" stroke-width="1.5"/>
  <text x="858" y="468" fill="#14532D" font-family="sans-serif" font-size="12.5" font-weight="700">3. Kanal Pemulihan &amp; Gugatan</text>
  <text x="858" y="490" fill="#141413" font-family="sans-serif" font-size="12">Pelindungan hukum bagi warga</text>
  <text x="858" y="508" fill="#57534E" font-family="sans-serif" font-size="11.5">sesuai mekanisme UU PDP</text>

  <!-- Connecting Arrows -->
  <g stroke="#141413" stroke-width="2.5">
    <line x1="382" y1="345" x2="436" y2="345"/>
    <polygon points="439,345 429,339 429,351" fill="#141413"/>
    <line x1="758" y1="345" x2="812" y2="345"/>
    <polygon points="815,345 805,339 805,351" fill="#141413"/>
  </g>

  <!-- Footer Caption Bar inside SVG -->
  <text x="64" y="612" fill="#44403C" font-family="monospace" font-size="11.5" font-weight="600">
    SUMBER PRIMER: PASAL 46 UU NO. 27/2022 (UU PDP) &amp; PERMENKOMDIGI NO. 15/2025 · GRAFIS DOKUMENTER REDAKSI VERITY
  </text>
