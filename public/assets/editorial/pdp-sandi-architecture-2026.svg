  <rect x="442" y="138" width="316" height="412" fill="#141413" stroke="#141413" stroke-width="2"/>
  <text x="468" y="176" fill="#D6CEBE" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">
