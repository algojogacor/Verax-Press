  <!-- Outer Editorial Plate Border -->
  <rect x="36" y="28" width="1128" height="619" fill="none" stroke="#141413" stroke-width="2"/>
  <rect x="42" y="34" width="1116" height="607" fill="none" stroke="#C7C0B3" stroke-width="1"/>

  <!-- Top Editorial Classification Banner -->
  <rect x="64" y="52" width="1072" height="44" fill="#141413"/>
  <text x="88" y="79" fill="#FBF9F5" font-family="monospace" font-size="12.5" font-weight="700" letter-spacing="1.8">
