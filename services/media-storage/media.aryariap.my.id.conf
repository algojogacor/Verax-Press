# ==============================================================================
# Nginx Virtual Host for Verax Press Media Storage Service
# Domain: media.aryariap.my.id
# Upstream: http://127.0.0.1:4188 (Node.js microservice)
# ==============================================================================

# Rate limiting zone for upload requests
limit_req_zone $binary_remote_addr zone=verax_media_upload_limit:10m rate=10r/m;

server {
    server_name media.aryariap.my.id;

    include /etc/nginx/snippets/block-rsc-rce.conf;

    # Maximum upload size (12MB allows 10MB file + multipart overhead)
    client_max_body_size 12m;

    # 1. Public Media Delivery (Static, cached, immutable)
    location ^~ /public/ {
        limit_except GET HEAD {
            deny all;
        }

        # Check /var/lib/verax/media/public/ first, fallback to user directory if used
        alias /var/lib/verax/media/public/;
        
        default_type application/octet-stream;
        types {
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
        try_files $uri =404;
    }

    # 2. Internal Private Media Delivery (Only accessible via X-Accel-Redirect from API)
    location ^~ /internal-media-private/ {
        internal;
        alias /var/lib/verax/media/private/;
        
        default_type application/octet-stream;
        types {
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            application/pdf pdf;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 3. Media API Upload Endpoint (Rate limited, authenticated upstream)
    location = /api/v1/media/upload {
        limit_req zone=verax_media_upload_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:4188/api/v1/media/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # 4. Media API Routes (Metadata, download authorization, soft delete)
    location /api/ {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Internal "true";
    }

    # 5. Service Health Endpoint
    location = /health {
        proxy_pass http://127.0.0.1:4188/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Guard against sensitive files & dotfiles
    location ~* \.(sqlite|db|env|log|bak|conf|tar|gz|sh)$ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location / {
        return 404;
    }

    listen 80;
}
